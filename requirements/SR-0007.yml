uid: SR-0007
type: system_requirement
status: proposed
title: Write a specific, informative subject line
text: Give the email a subject line that says what it is about and why it matters,
  so the reader can tell from the inbox whether and when to open it; do not leave
  it vague or blank.
normative: true
